<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one column app, bottom tab bar, bottom-sheet editors. Skincare = iris, makeup = rose. Dates and PAO in mono like a pack label. */
:root{
  --bg:#F2F1F6; --surface:#FFFFFF; --surface-2:#E9E7F1; --ink:#1D1A2B; --muted:#625E78; --line:#DAD7E6;
  --iris:#4A3FCF; --iris-ink:#FFFFFF; --iris-soft:#E6E3FB;
  --rose:#B8325F; --rose-ink:#FFFFFF; --rose-soft:#F8E1E9;
  --ok:#1F7A55; --ok-soft:#DDF1E8; --warn:#8F5A08; --warn-soft:#F7EAD0; --bad:#B3321F; --bad-soft:#F8DEDA;
  --shadow:0 1px 2px rgba(29,26,43,.06),0 10px 24px -14px rgba(29,26,43,.25);
  --scrim:rgba(14,11,28,.55);
  --sel:var(--iris); --sel-soft:var(--iris-soft); --sel-ink:var(--iris-ink);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13111C; --surface:#1C1929; --surface-2:#272336; --ink:#EEEBFA; --muted:#A5A0BC; --line:#332F47;
    --iris:#A59CFF; --iris-ink:#14102E; --iris-soft:#2A2554;
    --rose:#F08CAE; --rose-ink:#2B0E19; --rose-soft:#43202F;
    --ok:#5FD0A0; --ok-soft:#173528; --warn:#E8B558; --warn-soft:#3B2D12; --bad:#F2796A; --bad-soft:#40201C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13111C; --surface:#1C1929; --surface-2:#272336; --ink:#EEEBFA; --muted:#A5A0BC; --line:#332F47;
  --iris:#A59CFF; --iris-ink:#14102E; --iris-soft:#2A2554;
  --rose:#F08CAE; --rose-ink:#2B0E19; --rose-soft:#43202F;
  --ok:#5FD0A0; --ok-soft:#173528; --warn:#E8B558; --warn-soft:#3B2D12; --bad:#F2796A; --bad-soft:#40201C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(92px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:720px;margin:0 auto}
.mk{--sel:var(--rose);--sel-soft:var(--rose-soft);--sel-ink:var(--rose-ink)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:24px;line-height:1.15;font-weight:800}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted,.sub{color:var(--muted)}
.sub{font-size:13px}
.mono{font-family:var(--f-mono)}
.eyebrow{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:grid;gap:16px}
.gap-s{display:grid;gap:8px}
.row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:21px;font-weight:800;line-height:1.1}
.logo{width:34px;height:34px;border-radius:50%;background:var(--iris);color:var(--iris-ink);display:grid;place-items:center;flex:none}
.store{font:500 11.5px var(--f-mono);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.store::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.store.local::before{background:var(--warn)} .store.memory::before{background:var(--bad)}

/* controls */
.btn{font:700 14.5px var(--f-body);border-radius:12px;min-height:46px;padding:0 18px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--sel);color:var(--sel-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--surface-2);padding:3px;border-radius:12px}
.seg button{border:0;background:transparent;color:var(--muted);font:700 13.5px var(--f-body);padding:8px 6px;border-radius:9px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13.5px var(--f-body);padding:7px 12px;border-radius:999px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel-soft);border-color:var(--sel);color:var(--sel);font-weight:700}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font:700 12.5px var(--f-body);color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;font:400 15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=color]{width:56px;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:84px;resize:vertical}
::placeholder{color:var(--muted);opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.two{grid-template-columns:1fr}}

/* panels and lists */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;cursor:pointer;min-height:64px}
.list>.row:first-child,.list>div:first-child>.row:first-child{border-top:0}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;color:var(--muted);font-size:13px;margin-top:2px}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--iris-soft);color:var(--iris)}
.tile.mk{background:var(--rose-soft);color:var(--rose)}
.sw{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 3px var(--surface)}
.st{font:500 12px var(--f-mono);padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok);background:var(--ok-soft)} .st.soon{color:var(--warn);background:var(--warn-soft)} .st.bad{color:var(--bad);background:var(--bad-soft)}
.st.none,.st.done{color:var(--muted);background:var(--surface-2)}
.pao{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-mono);color:var(--muted)}
.list-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:2px 2px 8px}
.empty{text-align:center;padding:28px 18px;border:1px dashed var(--line);border-radius:14px;display:grid;gap:12px;justify-items:center}
.empty p{max-width:36ch}
.note{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);font-size:14px}
.note.info{background:var(--surface-2);border-color:var(--line)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:var(--ok)}

/* steps */
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.idx{width:28px;height:28px;border-radius:50%;background:var(--sel-soft);color:var(--sel);display:grid;place-items:center;font:500 12px var(--f-mono)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0}
.ck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.sb{min-width:0;display:grid;gap:4px}
.st-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pchip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 13px var(--f-body);cursor:pointer;text-align:left}
.miss{border:1px dashed var(--warn);color:var(--warn);border-radius:999px;padding:3px 10px;font:500 12.5px var(--f-body)}
.why{font-size:13px;color:var(--muted);font-style:normal}
.need{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.need-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.budget{font:500 12px var(--f-mono);color:var(--muted)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:0}
.crit p{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

/* photos and looks */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.slot{position:relative;aspect-ratio:3/4;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-size:12.5px;text-align:center;cursor:pointer;overflow:hidden;padding:8px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;padding:18px 8px 6px;font-size:12px;font-weight:700}
.slot .rm{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.look{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;cursor:pointer;color:inherit;font:inherit;min-width:0}
.look img{display:block;width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover}
.look .lb{padding:10px 12px;display:grid;gap:6px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sel)}
.busy{display:flex;gap:12px;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.spin{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--sel);border-radius:50%;animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* nav, sheet, toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:6px 2px;font:700 11px var(--f-body);border-radius:10px;cursor:pointer;min-height:52px}
.tab[aria-current="page"]{color:var(--iris)}
.tab[aria-current="page"] svg{stroke-width:2.3}
.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(580px,100%);max-height:92dvh;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:min(92vw,460px);text-align:center;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
/* ===== Nācreā · Liquid Glass ===== */
:root{
  --bg:#F3EFE9; --surface:rgba(255,255,255,.52); --surface-2:rgba(255,255,255,.42); --ink:#241E19; --muted:#6B6158; --line:rgba(255,255,255,.65);
  --iris:#7A5C45; --iris-soft:rgba(140,105,80,.15); --rose:#A5524A; --rose-soft:rgba(176,100,90,.15);

  --edge:rgba(255,255,255,.85); --edge-dim:rgba(120,95,70,.20);
  --shadow:0 1px 1px rgba(255,255,255,.7) inset,0 12px 32px -16px rgba(80,60,40,.28);

}

    --surface:rgba(255,255,255,.07); --surface-2:rgba(255,255,255,.09); --line:rgba(255,255,255,.12);

}
:root[data-theme="dark"]{
  --bg:#14110E; --ink:#F2EBE4; --muted:#B5A99D; --iris:#D8B598; --iris-ink:#2A1D12; --rose:#E5A096; --rose-ink:#2E1512;
  --surface:rgba(255,255,255,.07); --surface-2:rgba(255,255,255,.09); --line:rgba(255,255,255,.12);

  --edge:rgba(255,255,255,.18); --edge-dim:rgba(0,0,0,.35);

h1,h2,h3{font-weight:600;letter-spacing:-.02em}
h2{font-weight:600;font-size:26px}
.brand h1{font-weight:600;font-size:22px;letter-spacing:.01em}

.logo svg{display:none}

/* glass surfaces */
.panel,.list,.need,.look,.empty,.busy,.note.info,.slot,.chip,.pchip,.icon-btn,input[type=text],input[type=date],input[type=number],select,textarea,input[type=color]{
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.panel,.list,.need,.look{background:var(--surface);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow)}
.panel.flat,.empty,.busy,.slot{background:var(--surface-2);border:1px dashed var(--edge-dim);border-radius:22px}
.row{border-top:1px solid var(--line)}
.step,.crit{border-top-color:var(--line)}
.tile{border-radius:14px;box-shadow:0 0 0 1px var(--edge) inset}
.chip,.pchip{background:var(--surface);border:1px solid var(--edge);box-shadow:0 1px 1px rgba(255,255,255,.5) inset}
.chip[aria-pressed="true"]{background:var(--sel-soft);border-color:var(--sel)}
input[type=text],input[type=date],input[type=number],select,textarea,input[type=color]{background:var(--surface);border:1px solid var(--edge);border-radius:14px;box-shadow:0 1px 2px rgba(80,60,40,.06) inset}
.icon-btn{background:var(--surface);border:1px solid var(--edge)}
.seg{background:var(--surface-2);border:1px solid var(--edge);border-radius:16px;padding:3px;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}

.seg button[aria-pressed="true"]{background:rgba(255,255,255,.75);color:var(--ink);box-shadow:0 4px 12px -6px rgba(80,60,40,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:rgba(255,255,255,.16)}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:rgba(255,255,255,.16)}

/* buttons */

(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid8=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const A=x=>Array.isArray(x)?x:[];

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function merge(d){
  if(!d||typeof d!=='object')return;
  for(const k of Object.keys(S)){
    if(d[k]===undefined)continue;
    if(S[k]&&typeof S[k]==='object'&&!Array.isArray(S[k])&&d[k]&&typeof d[k]==='object')Object.assign(S[k],d[k]);
    else S[k]=d[k];
  }
}

const Store={
  mode:'memory',base:null,chain:Promise.resolve(),tm:null,tl:null,lastErr:0,
  async init(){
    const user=await cap('user');let id=null;
    try{id=user?await user.id():null}catch{}
    const db=await cap('db');
    if(db&&id){
      try{
        const base=db.doc('data/users/'+id+'/main');
        const m=await base.get();
        if(m.exists)merge(clone(m.data()));
        const [p,l,w]=await Promise.all([base.collection('products').get(),base.collection('looks').get(),base.collection('wish').get()]);
        S.products=p.docs.map(d=>({...clone(d.data()),id:d.id}));
        S.looks=l.docs.map(d=>({...clone(d.data()),id:d.id}));
        S.wish=w.docs.map(d=>({...clone(d.data()),id:d.id}));
        this.base=base;this.mode='db';return;
      }catch(e){console.warn('db',e)}
    }
    try{const raw=localStorage.getItem(KEY);if(raw)merge(JSON.parse(raw));this.mode='local'}catch{this.mode='memory'}
  },
  q(fn){this.chain=this.chain.then(fn).catch(e=>this.fail(e))},
  fail(e){
    console.warn(e);
    if(Date.now()-this.lastErr<4000)return;this.lastErr=Date.now();
    toast(e&&e.code==='quota_exceeded'?"Espace de sauvegarde plein : supprime des looks ou des produits.":"Sauvegarde impossible pour le moment.");
  },
  saveMain(){
    if(this.mode==='db'){clearTimeout(this.tm);this.tm=setTimeout(()=>this.q(()=>this.base.set(clone(mainPayload()))),500)}
    else this.saveLocal();
  },
  saveItem(col,it){if(this.mode==='db')this.q(()=>this.base.collection(col).doc(it.id).set(clone(it)));else this.saveLocal()},
  delItem(col,id){if(this.mode==='db')this.q(()=>this.base.collection(col).doc(id).delete());else this.saveLocal()},
  saveLocal(){
    if(this.mode==='memory')return;
    clearTimeout(this.tl);
    this.tl=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{this.fail()}},300);
  }
};

/* ---------- product logic ---------- */
const prod=id=>S.products.find(p=>p.id===id)||null;
function expiryDate(p){
  const c=[];const e=parseISO(p.expiry);if(e)c.push(e.getTime());
  const o=parseISO(p.opened);if(o&&Number(p.pao)>0)c.push(addMonths(o,Number(p.pao)).getTime());
  return c.length?new Date(Math.min(...c)):null;
}
function daysLeft(p){const e=expiryDate(p);return e?Math.round((e-startToday())/864e5):null}
function status(p){
  if(p.finished)return 'done';
  const d=daysLeft(p);
  if(d===null)return 'none';if(d<0)return 'bad';if(d<=30)return 'soon';return 'ok';
}
function badge(p){
  const s=status(p),d=daysLeft(p);
  const t=s==='done'?'Terminé':s==='none'?'Sans date':s==='bad'?'Expiré '+(-d)+' j':d>=60?Math.round(d/30)+' mois':'J-'+d;
  return '<span class="st '+s+'">'+t+'</span>';
}
const byDays=(a,b)=>(daysLeft(a)??99999)-(daysLeft(b)??99999);
const catsOf=t=>t==='makeup'?MK_CATS:SKIN_CATS;
function tile(p){

}

    badge(p)+'</button>';
}

/* ---------- misc ui helpers ---------- */
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}
function root(path){return path.startsWith('draft.')?[sheet&&sheet.draft,path.slice(6),true]:[S,path,false]}
function getPath(path){const [o,p]=root(path);return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(path,val){
  const [o,p,d]=root(path);if(!o)return;
  const ks=p.split('.');let c=o;for(let i=0;i<ks.length-1;i++)c=c[ks[i]];
  c[ks[ks.length-1]]=val;if(!d)Store.saveMain();
}
function chips(path,opts,multi){
  const cur=getPath(path);
  return '<div class="chips" role="group">'+opts.map(o=>{
    const on=multi?A(cur).includes(o):cur===o;
    return '<button type="button" class="chip" aria-pressed="'+on+'" '+(multi?'data-chip':'data-single')+'="'+path+'" data-val="'+esc(o)+'">'+esc(o)+'</button>';

function errCopy(e){
  const c=e&&e.code;
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared')return "L'analyse n'est pas autorisée pour cette page.";
  if(c==='rate_limited')return "Trop de demandes ou limite d'usage atteinte. Réessaie un peu plus tard.";
  if(c==='image_rejected')return "Une photo n'a pas pu être lue. Essaie une autre image.";
  if(c==='invalid_json')return "La réponse n'a pas pu être lue. Relance l'analyse.";
  if(c==='refused')return "Cette demande n'a pas pu être traitée avec ces éléments. Change la photo ou le texte.";
  if(c==='session_expired')return "Ta session a expiré. Rouvre la page.";
  return "L'analyse a échoué. Réessaie.";
}
async function aiCall(key,exec){
  if(ui.busy||!AI.sample)return null;
  ui.busy={key};ctl=new AbortController();render();if(sheet&&sheet.kind==='look')renderSheet();
  try{return await exec(ctl.signal)}
  catch(e){if(!e||e.code!=='cancelled')toast(errCopy(e));return null}
  finally{ui.busy=null;ctl=null;render();if(sheet&&sheet.kind==='look')renderSheet()}
}
const JSON_RULE="Réponds uniquement avec un objet JSON valide, sans texte autour, en français.";

/* ---------- images ---------- */
async function loadBitmap(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch{}}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u});
}
async function toJpeg(file,max,q){
  const b=await loadBitmap(file);
  const r=Math.min(1,max/Math.max(b.width,b.height));
  const w=Math.max(1,Math.round(b.width*r)),h=Math.max(1,Math.round(b.height*r));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(b,0,0,w,h);
  if(b.close)b.close();
  return await new Promise((res,rej)=>cv.toBlob(x=>x?res(x):rej(new Error('blob')),'image/jpeg',q));
}
const blobToDataUrl=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
function dataUrlToBlob(u){
  const [h,b]=u.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:mime});
}

function normAnalysis(r){

  return {date:todayStr(),resume:T(r.resume),typeProbable:T(r.typeProbable)||'incertain',confiance:T(r.confiance)||'moyenne',
    criteres:A(r.criteres).map(c=>({nom:T(c.nom),etat:et(c.etat),note:T(c.note)})).filter(c=>c.nom),
    zones:A(r.zones).map(z=>({zone:T(z.zone),observation:T(z.observation)})).filter(z=>z.zone),
    aConsulter:A(r.aConsulter).map(String),conseilsPhoto:A(r.conseilsPhoto).map(String)};
}
async function analyzeSkin(){
  const used=SLOTS.filter(s=>photos[s.k]);
  const withImgs=used.length>0&&AI.images;
  const order=used.map((s,i)=>(i+1)+') '+s.label).join(' ; ');
  const prompt=[
    "Tu es un conseiller skincare bienveillant et rigoureux (tu n'es pas médecin). Tu analyses la peau d'une personne à partir "+(withImgs?"de photos, dans cet ordre : "+order+".":"de son profil déclaré uniquement (aucune photo disponible)."),

function closeSheet(){sheet=null;$('#sheet').innerHTML='';document.body.style.overflow=''}
function renderSheet(){
  if(!sheet){closeSheet();return}
  $('#sheet').innerHTML=sheet.kind==='product'?productSheet():lookSheet();
  document.body.style.overflow='hidden';
  const p=$('#sheet .sheet');if(p&&!sheet.focused){p.focus({preventScroll:true});sheet.focused=true}
  if(sheet.kind==='product')updateHint();
}
function openProduct(id,preset){
  const p=id?prod(id):null;
  const d=p?clone(p):Object.assign({type:'skin',cat:'',name:'',brand:'',actives:[],shade:'',finish:'',color:'',opened:'',pao:'',expiry:'',notes:'',finished:false},preset||{});
  const fromWish=d.fromWish||null;delete d.fromWish;
  if(!d.cat)d.cat=catsOf(d.type)[0];

  if(!d.pao)d.pao='';
  sheet={kind:'product',id:p?p.id:null,draft:d,fromWish};
  renderSheet();
}

function syncDraft(){
  const d=sheet.draft;
  for(const [k,id] of [['name','pf-name'],['brand','pf-brand'],['cat','pf-cat'],['shade','pf-shade'],['finish','pf-finish'],['opened','pf-opened'],['pao','pf-pao'],['expiry','pf-expiry'],['notes','pf-notes']]){
    const e=document.getElementById(id);if(e)d[k]=e.value;
  }
}
function updateHint(){
  const h=$('#pf-hint');if(!h)return;
  const tmp={expiry:($('#pf-expiry')||{}).value,opened:($('#pf-opened')||{}).value,pao:Number(($('#pf-pao')||{}).value)||0};
  const e=expiryDate(tmp);
  if(!e){h.textContent="Renseigne la date d'ouverture et la PAO, ou la date imprimée sur l'emballage, pour suivre la péremption.";return}
  const d=Math.round((e-startToday())/864e5);
  h.textContent=d<0?'Périmé depuis le '+fmtDate(e)+' ('+(-d)+' jours).':'Périme le '+fmtDate(e)+' (dans '+d+' jours).';
}
function saveProduct(){
  syncDraft();const d=sheet.draft;
  const name=d.name.trim();
  if(!name){toast('Donne un nom au produit.');return false}
  const old=sheet.id?prod(sheet.id):null;
  const rec={id:sheet.id||uid8(),type:d.type,cat:d.cat,name,brand:d.brand.trim(),actives:d.type==='skin'?A(d.actives):[],
    shade:d.type==='makeup'?d.shade.trim():'',finish:d.type==='makeup'?d.finish:'',color:d.type==='makeup'?(d.color||''):'',
    opened:d.opened||'',pao:Number(d.pao)||0,expiry:d.expiry||'',notes:d.notes.trim(),finished:!!d.finished,demo:false,created:old?old.created:todayStr()};
  if(old)S.products[S.products.indexOf(old)]=rec;else S.products.push(rec);
  Store.saveItem('products',rec);
  if(sheet.fromWish){S.wish=S.wish.filter(w=>w.id!==sheet.fromWish);Store.delItem('wish',sheet.fromWish)}
  return true;
}

    if(r.conseils.length)b+='<div>'+r.conseils.map(c=>'<p class="sub" style="margin-top:6px">'+esc(c)+'</p>').join('')+'</div>';
  }
  return '<div class="overlay"><div class="sheet mk" role="dialog" aria-modal="true" aria-label="Look" tabindex="-1">'+
    '<div class="sheet-h"><h3>Look</h3><button class="icon-btn" data-act="close-sheet" aria-label="Fermer">'+ic('x')+'</button></div>'+
    '<img src="'+L.thumb+'" alt="'+esc(L.title)+'" style="width:100%;max-width:320px;max-height:46vh;object-fit:cover;border-radius:14px;justify-self:center">'+
    field('Nom','<input id="lk-title" type="text" data-lookfield="title" value="'+esc(L.title)+'">','lk-title')+
    field('Note','<input id="lk-note" type="text" data-lookfield="note" value="'+esc(L.note||'')+'" placeholder="Occasion, ce que j\'aime dans ce look…">','lk-note')+
    busyBlock('look:'+L.id,'Claude analyse le look…')+
    '<div><button class="btn primary" data-act="look-analyze" data-id="'+L.id+'"'+(ui.busy||!AI.sample?' disabled':'')+'>'+ic('spark')+' '+(r?'Relancer l\'analyse':'Analyser avec mon stock')+'</button></div>'+
    b+
    '<div class="row-flex"><button class="btn danger" data-act="look-delete" data-id="'+L.id+'">Supprimer ce look</button></div></div></div>';
}

/* ---------- actions ---------- */
const ACT={
  tab:t=>go(t.dataset.val),
  when:t=>{ui.when=t.dataset.val;render()},
  'goto-routine':()=>{ui.skinTab='routine';go('skin')},
  'skin-tab':t=>{ui.skinTab=t.dataset.val;if(ui.tab!=='skin')ui.tab='skin';render();window.scrollTo(0,0)},
  'mk-tab':t=>{ui.mkTab=t.dataset.val;render()},
  ftype:t=>{ui.filter.type=t.dataset.val;render()},
  flag:t=>{ui.filter.flag=ui.filter.flag===t.dataset.val?'':t.dataset.val;render()},
  'open-product':t=>{openProduct(t.dataset.id||null)},
  'close-sheet':closeSheet,
  'load-demo':()=>{const L=sampleProducts();L.forEach(p=>{S.products.push(p);Store.saveItem('products',p)});render();toast('Exemples ajoutés')},
  'clear-demo':()=>{S.products.filter(p=>p.demo).forEach(p=>Store.delItem('products',p.id));S.products=S.products.filter(p=>!p.demo);render();toast('Exemples supprimés')},
  done:t=>{
    const id=t.dataset.id;
    if(S.done.date!==todayStr())S.done={date:todayStr(),ids:[]};
    const i=S.done.ids.indexOf(id);if(i>=0)S.done.ids.splice(i,1);else S.done.ids.push(id);
    Store.saveMain();render();
  },
  'pf-type':t=>{
    syncDraft();const d=sheet.draft,nt=t.dataset.val;
    if(d.type!==nt){d.type=nt;d.cat=catsOf(nt)[0];d.pao=PAO_DEF[d.cat]||''}
    renderSheet();
  },
  'pf-today':()=>{const e=$('#pf-opened');e.value=todayStr();updateHint()},
  'pf-pao':t=>{$('#pf-pao').value=t.dataset.val;updateHint()},
  'pf-nocolor':()=>{syncDraft();sheet.draft.color='';renderSheet()},
  'pf-save':()=>{const isNew=!sheet.id;if(saveProduct()){closeSheet();render();toast(isNew?'Produit ajouté':'Produit mis à jour')}},
  'pf-finished':()=>{syncDraft();const fin=!sheet.draft.finished;sheet.draft.finished=fin;if(saveProduct()){closeSheet();render();toast(fin?'Produit marqué comme terminé':'Produit remis en cours')}},
  'pf-delete':t=>{
    if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Confirmer la suppression';return}
    const id=sheet.id;S.products=S.products.filter(p=>p.id!==id);Store.delItem('products',id);closeSheet();render();toast('Produit supprimé');
  },
  'wish-add':()=>{
    const l=$('#wf-label').value.trim();if(!l){toast('Écris ce que tu cherches.');return}
    addWish({label:l,type:$('#wf-type').value,budget:$('#wf-budget').value});
  },
  'wish-del':t=>{const id=t.dataset.id;S.wish=S.wish.filter(w=>w.id!==id);Store.delItem('wish',id);render()},
  'wish-bought':t=>{const w=S.wish.find(x=>x.id===t.dataset.id);if(!w)return;openProduct(null,{name:w.label,type:w.type,cat:w.cat||undefined,fromWish:w.id})},
  'wish-from':t=>{
    const src=t.dataset.src,i=Number(t.dataset.i);
    if(src==='routine'&&S.routine&&S.routine.manques[i])missToWish(S.routine.manques[i],'skin','routine');
    else if(src==='mk'&&S.mkPlan&&S.mkPlan.manques[i])missToWish(S.mkPlan.manques[i],'makeup','maquillage');
    else if(src==='look'){
      const L=S.looks.find(x=>x.id===t.dataset.look);const e=L&&L.result&&L.result.etapes[i];
      if(e&&e.manque){
        const m=e.manque;
        addWish({label:m.categorie||e.zone,type:'makeup',note:[m.teinte,m.finition,m.alternative?'Alternative : '+m.alternative:''].filter(Boolean).join(' · '),from:'look'});
        renderSheet();
      }
    }
  },
  'pick-photo':(t,e)=>{if(e.target.tagName==='INPUT'||e.target.closest('.rm'))return;const i=$('#ph-'+t.dataset.k);if(i)i.click()},
  'rm-photo':(t,e)=>{e.stopPropagation();const p=photos[t.dataset.k];if(p){URL.revokeObjectURL(p.url);delete photos[t.dataset.k]}render()},
  'skin-analyze':()=>analyzeSkin(),
  'routine-build':()=>buildRoutine(),
  'mk-build':()=>buildMkPlan(),
  'ai-stop':()=>{if(ctl)ctl.abort()},
  'look-new':()=>{const i=$('#lk-file');if(i)i.click()},
  'open-look':t=>openLook(t.dataset.id),
  'look-analyze':t=>analyzeLook(t.dataset.id),
  'look-delete':t=>{
    if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Confirmer la suppression';return}
    const id=t.dataset.id;S.looks=S.looks.filter(l=>l.id!==id);delete lookBlobs[id];Store.delItem('looks',id);closeSheet();render();toast('Look supprimé');
  }
};
function chipClick(b){
  const path=b.dataset.chip;const arr=A(getPath(path)).slice();const v=b.dataset.val;
  const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);
  setPath(path,arr);b.setAttribute('aria-pressed',String(i<0));
}
function singleClick(b){
  const path=b.dataset.single,v=b.dataset.val;
  const nv=getPath(path)===v?'':v;setPath(path,nv);
  document.querySelectorAll('[data-single="'+path+'"]').forEach(x=>x.setAttribute('aria-pressed',String(nv!==''&&x.dataset.val===nv)));
}
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('overlay')){closeSheet();return}
  const a=e.target.closest('[data-act]');
  if(a){const f=ACT[a.dataset.act];if(f)f(a,e);return}
  const c=e.target.closest('[data-chip]');if(c){chipClick(c);return}
  const s=e.target.closest('[data-single]');if(s){singleClick(s);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.slot')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.bind){setPath(t.dataset.bind,t.value);return}
  if(t.id==='q'){ui.filter.q=t.value;renderList();return}
  if(t.id==='pf-opened'||t.id==='pf-pao'||t.id==='pf-expiry')updateHint();
  if(t.id==='pf-color'&&sheet)sheet.draft.color=t.value;
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='sort'){ui.filter.sort=t.value;renderList();return}
  if(t.id==='pf-cat'&&sheet){const el=$('#pf-pao');if(el&&!el.value){el.value=PAO_DEF[t.value]||'';updateHint()}return}
  if(t.dataset&&t.dataset.lookfield&&sheet){
    const L=S.looks.find(x=>x.id===sheet.id);if(L){L[t.dataset.lookfield]=t.value;Store.saveItem('looks',L);render()}return;
  }
  if(t.dataset&&t.dataset.slot&&t.files&&t.files[0]){
    const k=t.dataset.slot;
    try{
      const blob=await toJpeg(t.files[0],1024,.85);
      if(photos[k])URL.revokeObjectURL(photos[k].url);
      photos[k]={blob,url:URL.createObjectURL(blob)};render();
    }catch{toast("Cette image n'a pas pu être lue.")}
    return;
  }
  if(t.id==='lk-file'&&t.files&&t.files[0]){
    try{
      const f=t.files[0];
      const blob=await toJpeg(f,1024,.85);
      const thumb=await blobToDataUrl(await toJpeg(f,360,.7));
      const L={id:uid8(),title:'Nouveau look',note:'',thumb,created:todayStr(),result:null};
      S.looks.push(L);lookBlobs[L.id]=blob;Store.saveItem('looks',L);render();openLook(L.id);
    }catch{toast("Cette image n'a pas pu être lue.")}
  }
});

/* ---------- boot ---------- */
if('storage' in navigator&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
render();
(async()=>{
  await Store.init();
  AI.sample=await cap('sample');
  if(AI.sample){try{const l=await AI.sample.limits();AI.images=l&&l.images?l.images:null}catch{AI.images=null}}
  ready=true;render();
})();
})();
</script>

<script>
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloading)return;reloading=true;location.reload()});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
      const check=()=>r.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
      setInterval(check,60*60*1000);
    }).catch(()=>{});
  });
}
</script>
</body></html>
